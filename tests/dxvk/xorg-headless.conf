Section "ServerLayout"
    Identifier     "Headless"
    Screen      0  "Screen0" 0 0
EndSection

Section "Device"
    Identifier     "NVIDIA0"
    Driver         "nvidia"
    Option         "AllowEmptyInitialConfiguration" "true"
    Option         "UseDisplayDevice" "none"
    Option         "AllowEmptyInput" "true"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "NVIDIA0"
    DefaultDepth    24
    SubSection "Display"
        Depth       24
        Virtual     1920 1080
        Modes       "1920x1080"
    EndSubSection
EndSection
